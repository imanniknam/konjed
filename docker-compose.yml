services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment: { POSTGRES_USER: konjed, POSTGRES_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD}", POSTGRES_DB: konjed }
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U konjed"], interval: 5s, retries: 10 }
  app:
    build: .
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: "postgres://konjed:${DB_PASSWORD}@db:5432/konjed"
      SITE_URL: "${SITE_URL:?set SITE_URL (https://…)}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
    volumes: [uploads:/data/uploads]
    ports: ["3000:3000"]
volumes: { dbdata: {}, uploads: {} }
